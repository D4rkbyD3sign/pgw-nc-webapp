<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content Security Policy (record 241, spec A §3.2). GitHub Pages cannot send headers, so
         it lives here, BEFORE every link and script. Scripts get no 'unsafe-inline' and no
         'unsafe-eval': if an escape is ever missed, injected script still does not run.
         img-src carries ONE file beyond the spec's starting policy: https://www.google.com/images/cleardot.gif,
         the Firebase SDK's own network test after a failed connection (measured, record 241 Pass E). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google.com/images/cleardot.gif; connect-src 'self' https://*.googleapis.com https://www.google.com; frame-src https://www.youtube-nocookie.com https://www.google.com/recaptcha/ https://recaptcha.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ImplementAI 2026 — PGW National Conference</title>

    <!-- Add-to-home-screen. Without these, "install" produces a bookmark: a
         screenshot for an icon, the page <title> truncated under it, and the
         app opening inside browser chrome. The manifest is what makes it open
         clean and wear PGW's face — and it is the right answer on BOTH
         platforms. Safari has read the manifest since 2018 and it OVERRIDES
         Apple's old meta tags; Apple's own guidance is not to add
         apple-mobile-web-app-capable today, because it can harm the install
         when the manifest is readable. So: manifest, not Apple meta tags.
         The apple-touch-icon link stays — it costs one file and is what older
         iPhones reach for. (Checked against Apple/WebKit/web.dev 2026-08-21,
         not assumed.)

         Every href here is RELATIVE, including start_url and scope inside the
         manifest. The production domain is bought and not yet in hand; when it
         lands, none of this needs rewriting. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="img/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Stand-ins per brand guide: Poppins ≈ Nexa, JetBrains Mono for mono labels. Production swaps to licensed Nexa. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <main id="view" class="scroll"></main>
      <nav id="tabbar" class="tabs"></nav>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
